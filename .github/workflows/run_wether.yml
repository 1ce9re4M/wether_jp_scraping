name: Daily Weather Check

on:
  schedule:
    # 毎日 日本時間の 朝 5:00 に実行する場合（UTCは-9時間なので 20:00）
    # 例: 5:00 JST = 20:00 UTC（前日）
    - cron: '0 20 * * *'
  workflow_dispatch: # 手動でもボタン一つで動かせるようにする

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run script
        run: |
          python wether_jp2.py
